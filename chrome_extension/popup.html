<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0a0e1a;
      color: #dfe2f3;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .header {
      display: flex;
      items-center: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .title {
      font-size: 13px;
      font-weight: 800;
      color: #8aebff;
      letter-spacing: 0.5px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5eead4;
      box-shadow: 0 0 8px #5eead4;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 11px;
      line-height: 1.5;
    }
    .label {
      color: #859397;
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #dfe2f3;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-family: inherit;
    }
    button {
      width: 100%;
      background: #8aebff;
      color: #00363e;
      font-weight: 800;
      border: none;
      padding: 9px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(138,235,255,0.4);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ JARVIS CAREER COPILOT</div>
    <div class="status-dot" id="status-dot"></div>
  </div>

  <div class="card">
    <div class="label">JARVIS Backend Endpoint</div>
    <input type="text" id="server-url" value="https://daily-ai-whatsapp-engine.onrender.com" />
  </div>

  <div class="card" id="profile-summary">
    <div class="label">Candidate Active Profile</div>
    <div>👤 Madansai Daram</div>
    <div style="color: #859397;">SQL, Python, Power BI Data Analyst</div>
  </div>

  <button id="btn-save-options">Save Settings</button>

  <script src="popup.js"></script>
</body>
</html>
