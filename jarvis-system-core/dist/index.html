  <body>
    <div id="root"></div>
    <script>
      // Register the service worker early so the console is installable as a desktop/mobile app.
      // (Push registration in src/lib/push.ts reuses this same /console/sw.js registration.)
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/console/sw.js", { scope: "/console/" }).catch(function () {});
        });
      }
    </script>
  </body>
